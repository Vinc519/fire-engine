name: Build
on: [push, pull_request]

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools
      - name: Configure
        run: cmake --preset wsl-release-gcc
      - name: Build
        run: cmake --build --preset wsl-release-gcc

  build-windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.4.341.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
